name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir www
          cp warehouse_android.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"com.security.rooms","appName":"SecureRooms","webDir":"www"}' > capacitor.config.json
      - name: Add Android
        run: |
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Add PDF print bridge
        run: |
          cat > android/app/src/main/java/com/security/rooms/MainActivity.java <<'EOF'
          package com.security.rooms;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private WebView printWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new PrintBridge(), "AndroidPrint");
              }

              private class PrintBridge {
                  @JavascriptInterface
                  public void printHtml(final String html, final String jobName) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              final WebView wv = new WebView(MainActivity.this);
                              wv.setWebViewClient(new WebViewClient() {
                                  private boolean started = false;
                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      if (started) return;
                                      started = true;
                                      PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                      PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(jobName);
                                      pm.print(jobName, adapter, new PrintAttributes.Builder()
                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());
                                  }
                              });
                              printWebView = wv;
                              wv.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          }
                      });
                  }
              }
          }
          EOF
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SecureRooms-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
